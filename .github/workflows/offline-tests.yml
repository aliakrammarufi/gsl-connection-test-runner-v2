{
  "name": "Offline checks",
  "on": {"push": {"branches": ["main"]}},
  "permissions": {"contents": "read"},
  "jobs": {"offline": {
    "runs-on": "ubuntu-24.04",
    "timeout-minutes": 3,
    "steps": [
      {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"persist-credentials": false}},
      {"run": "python3 -I test_runner.py"}
    ]
  }}
}
