{
  "name": "One reviewed connection test",
  "on": {"workflow_dispatch": {"inputs": {"reviewed_sha": {"description": "Exact independently reviewed 40-character main commit", "required": true, "type": "string"}}}},
  "permissions": {"contents": "read"},
  "env": {
    "APPROVED_COMMIT_SHA": "${{ vars.APPROVED_COMMIT_SHA }}",
    "APPROVED_REPOSITORY_ID": "${{ vars.APPROVED_REPOSITORY_ID }}",
    "CONTROL_REVIEW_COMPLETE": "${{ vars.CONTROL_REVIEW_COMPLETE }}",
    "REVIEWED_SHA": "${{ inputs.reviewed_sha }}"
  },
  "jobs": {
    "audit": {
      "if": "${{ github.repository == 'aliakrammarufi/gsl-connection-test-runner-v2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.reviewed_sha == github.sha && github.workflow_sha == github.sha && vars.APPROVED_COMMIT_SHA == github.sha && vars.CONTROL_REVIEW_COMPLETE == 'true' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "permissions": {"contents": "read", "actions": "read"},
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {"name": "Offline regression checks", "run": "python3 -I test_runner.py"},
        {"name": "Read public protection metadata only", "env": {"GH_TOKEN": "${{ github.token }}"}, "run": "python3 -I runner.py --audit-controls"}
      ]
    },
    "test": {
      "needs": "audit",
      "if": "${{ github.repository == 'aliakrammarufi/gsl-connection-test-runner-v2' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && github.run_attempt == 1 && inputs.reviewed_sha == github.sha && github.workflow_sha == github.sha && vars.APPROVED_COMMIT_SHA == github.sha && vars.CONTROL_REVIEW_COMPLETE == 'true' }}",
      "runs-on": "ubuntu-24.04",
      "timeout-minutes": 3,
      "environment": {"name": "connection-test", "url": "https://github.com/aliakrammarufi/gsl-connection-test-runner-v2/commit/${{ github.sha }}"},
      "permissions": {"contents": "write", "actions": "read"},
      "steps": [
        {"uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1", "with": {"ref": "${{ github.sha }}", "persist-credentials": false}},
        {"name": "Consume fence then attempt the fixed message once", "run": "python3 -I runner.py --one-test", "env": {
          "GH_TOKEN": "${{ github.token }}",
          "RELEASE_ONE_TEST": "${{ vars.RELEASE_ONE_TEST }}",
          "TELEGRAM_BOT_TOKEN": "${{ secrets.TELEGRAM_BOT_TOKEN }}",
          "TELEGRAM_CHAT_ID": "${{ secrets.TELEGRAM_CHAT_ID }}",
          "TELEGRAM_CHAT_SHA256": "${{ secrets.TELEGRAM_CHAT_SHA256 }}",
          "DESTINATION_PRIVATELY_CONFIRMED": "${{ secrets.DESTINATION_PRIVATELY_CONFIRMED }}"
        }}
      ]
    }
  }
}
